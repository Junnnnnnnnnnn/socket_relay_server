<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Dart – Controller</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <style>
    :root {
      --bg: #0b1020;
      --fg: #e8f0ff;
      --card: #111a33;
      --muted: #8aa0c7;
      --accent: #2a71ff;
      --danger: #ff4d5e;
    }

    html,
    body {
      height: 100%
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, Apple SD Gothic Neo, sans-serif;
      display: grid;
      place-items: center
    }

    .wrap {
      width: min(560px, 92vw);
      display: grid;
      gap: 12px
    }

    .card {
      background: var(--card);
      border: 1px solid #22325a;
      border-radius: 16px;
      padding: 14px
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap
    }

    input,
    button,
    select {
      font-size: 16px;
      border-radius: 12px;
      border: 1px solid #2a3a66;
      background: #0a1430;
      color: var(--fg);
      padding: 12px
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent)
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed
    }

    .chips button {
      border-radius: 999px;
      padding: 8px 14px
    }

    .muted {
      color: var(--muted);
      font-size: 13px
    }

    .big {
      font-size: 22px;
      font-weight: 700
    }

    .status {
      min-height: 20px
    }

    .room-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px
    }

    .room-info .count {
      font-weight: 600;
      color: var(--accent)
    }

    .players {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 4px
    }

    .players li {
      padding: 6px 10px;
      background: #0a1430;
      border-radius: 8px;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .players li.me {
      background: #1a2a5a;
      border: 1px solid var(--accent)
    }

    .players .empty {
      color: var(--muted);
      font-style: italic;
      justify-content: center
    }

    .full-banner {
      background: var(--danger);
      color: white;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      font-weight: 600;
      display: none
    }

    .full-banner.show {
      display: block
    }
  </style>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <div class="row">
        <div class="big">Dart Controller</div>
      </div>
      <div class="row">
        <label>Room</label>
        <input id="room" style="flex:1" />
        <input id="name" placeholder="닉네임" style="flex:1" />
      </div>
      <div class="row chips">
        <span class="muted">화살:</span>
        <button data-skin="red">Red</button>
        <button data-skin="blue">Blue</button>
        <button data-skin="gold">Gold</button>
      </div>
      <div class="row">
        <button id="perm">모션 권한</button>
        <button id="ready" class="primary" style="flex:1">Ready & Aim</button>
        <button id="cancel" style="flex:1">Cancel</button>
      </div>
      <div class="row">
        <button id="joinQueue" style="flex:1">큐 참가</button>
        <button id="leaveQueue" style="flex:1">큐 나가기</button>
        <button id="resetQueue">큐 초기화</button>
        <button id="resetRoom">방 초기화</button>
      </div>
      <div class="muted">Ready 후, 폰을 <b>앞으로</b> 빠르게 휘둘러 던지세요.</div>
      <div class="status" id="status"></div>
      <div class="muted" id="queueStatus">큐: []</div>
    </div>

    <div class="full-banner" id="fullBanner">🚫 방이 가득 찼습니다 (최대 <span id="maxPlayers">4</span>명)</div>

    <div class="card">
      <div class="room-info">
        <div><b>방 참가자</b></div>
        <div class="count">현재 <span id="playerCount">0</span>명</div>
      </div>
      <ul id="playersList" class="players">
        <li class="empty">아직 참가자가 없습니다</li>
      </ul>
    </div>
  </div>

  <script>
    // ---- 초기화 ----
    const url = new URL(location.href);
    const roomInput = document.getElementById("room");
    roomInput.value = (url.searchParams.get("room") || "DEMO").toUpperCase();
    const nameInput = document.getElementById("name");
    nameInput.value = url.searchParams.get("name") || ("Player" + Math.floor(Math.random() * 1000));

    let skin = "red";
    document.querySelectorAll("[data-skin]").forEach(b => {
      b.onclick = () => {
        skin = b.dataset.skin;
        setStatus(`선택: ${skin}`);
      };
    });

    function setStatus(t) {
      document.getElementById("status").textContent = t;
    }

    function room() {
      return (roomInput.value || "DEMO").toUpperCase();
    }
    const playerName = () => (nameInput.value || "Player").slice(0, 16);

    // ---- Socket ----
    const SOCKET_HOST = "your-socket-server";
    // connect 시점에는 이름 전달 X (이름은 joinRoom에서만 전달)
    const socket = io(SOCKET_HOST, {
      path: "/socket", // Nginx에서 /socket → /socket.io 프록시
      query: {
        room: room()
      },
      reconnection: true,
      transports: ["websocket"],
    });

    // 방 참가 요청 (이름 포함)
    function joinRoom() {
      socket.emit("joinRoom", {
        room: room(),
        name: playerName()
      });
    }

    socket.on("connect", () => {
      setStatus(`소켓 연결됨 (#${socket.id})`);
      hideFullBanner();
      joinRoom();
      socket.emit("status-queue");
    });
    socket.on("connect_error", (err) => setStatus(`연결 실패: ${err.message}`));
    socket.on("disconnect", (reason) => setStatus(`연결 해제 (${reason})`));

    // ---- 방 관련 이벤트 ----
    socket.on("joinedRoom", (data) => {
      // data = { room, playerCount, players: [{ socketId, name }] }
      renderPlayers(data.players || [], data.playerCount);
    });

    socket.on("roomPlayerCount", (data) => {
      // data = { room, playerCount } — 이름 리스트 없음. count만 갱신
      document.getElementById("playerCount").textContent = data.playerCount ?? 0;
    });

    socket.on("roomFull", (data) => {
      // data = { room, maxPlayers }
      document.getElementById("maxPlayers").textContent = data.maxPlayers ?? 4;
      document.getElementById("fullBanner").classList.add("show");
      setStatus(`방 ${data.room}은 가득 찼습니다 (최대 ${data.maxPlayers}명)`);
      disableGameActions(true);
    });

    function hideFullBanner() {
      document.getElementById("fullBanner").classList.remove("show");
      disableGameActions(false);
    }

    function disableGameActions(disabled) {
      ["ready", "joinQueue", "leaveQueue"].forEach(id => {
        document.getElementById(id).disabled = disabled;
      });
    }

    function renderPlayers(players, count) {
      const ul = document.getElementById("playersList");
      const countEl = document.getElementById("playerCount");
      countEl.textContent = count ?? players.length;
      ul.innerHTML = "";
      if (!players.length) {
        ul.innerHTML = '<li class="empty">아직 참가자가 없습니다</li>';
        return;
      }
      players.forEach((p, i) => {
        const li = document.createElement("li");
        const isMe = p.socketId === socket.id;
        if (isMe) li.classList.add("me");
        li.textContent = `${i + 1}. ${p.name}${isMe ? " (나)" : ""}`;
        ul.appendChild(li);
      });
    }

    // 큐 상태 업데이트 수신
    socket.on("status-queue", (queue) => {
      document.getElementById("queueStatus").textContent = `큐: [${queue.join(", ")}]`;
    });

    // ---- 모션 권한(iOS) ----
    document.getElementById("perm").onclick = async () => {
      try {
        if (window.DeviceMotionEvent && DeviceMotionEvent.requestPermission) {
          const r = await DeviceMotionEvent.requestPermission();
          if (r !== "granted") return alert("모션 권한 거부됨");
        }
        if (window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission) {
          await DeviceOrientationEvent.requestPermission();
        }
        alert("모션 권한 OK");
      } catch (e) {
        alert(e.message);
      }
    };

    // ---- 던지기 감지 (arming + baseline + jerk) ----
    const ARMING_MS = 600;
    const MAG_THRESH = 18;
    const JERK_THRESH = 8;

    // ---- 에임 송신(Ready 중 30Hz) ----
    const AIM_HZ = 30;
    const AIM_INTERVAL = 1000 / AIM_HZ;
    let lastAimSent = 0;

    let ready = false,
      accPeak = 0,
      lastAim = {
        x: 0,
        y: 0
      };
    let handleMotion = null,
      handleOrient = null;

    let armedAt = 0;
    let baselineSum = 0,
      baselineSamples = 0,
      prevMag = 0;
    let aimReady = false;

    let gravityZ = 0;

    function norm(v, a, b) {
      return Math.max(-1, Math.min(1, (v - a) / (b - a) * 2 - 1));
    }

    document.getElementById("ready").onclick = () => {
      ready = true;
      accPeak = 0;
      armedAt = performance.now();
      baselineSum = 0;
      baselineSamples = 0;
      prevMag = 0;
      aimReady = false;
      setStatus("조준 중… 앞으로 휘두르면 던집니다.");

      // 방 재보장 (이름 포함)
      joinRoom();

      handleOrient = (e) => {
        let g = e.gamma ?? 0;
        let b = e.beta ?? 0;

        const xNorm = norm(g, -45, 45);
        const yNorm = norm(b, 10, 80);

        const faceUp = Math.abs(gravityZ) > 4 && gravityZ < 0;
        lastAim.x = xNorm;
        lastAim.y = faceUp ? -yNorm : yNorm;

        aimReady = true;

        const now = performance.now();
        if (ready && now - lastAimSent > AIM_INTERVAL) {
          lastAimSent = now;
          socket.emit('aim-update', {
            room: room(),
            name: playerName(),
            skin,
            aim: {
              x: lastAim.x,
              y: lastAim.y
            },
          });
        }
      };
      window.addEventListener("deviceorientation", handleOrient);

      handleMotion = (e) => {
        const ag = e.accelerationIncludingGravity || {
          x: 0,
          y: 0,
          z: 0
        };
        gravityZ = ag.z || 0;

        const a = e.acceleration || ag;
        const mag = Math.hypot(a.x || 0, a.y || 0, a.z || 0);
        const now = performance.now();

        if (now - armedAt < ARMING_MS) {
          baselineSum += mag;
          baselineSamples++;
          prevMag = mag;
          return;
        }

        const baseline = baselineSamples ? (baselineSum / baselineSamples) : 0;
        const magAdj = Math.max(0, mag - baseline);
        const jerk = mag - prevMag;
        prevMag = mag;

        accPeak = Math.max(accPeak, magAdj);

        if (ready && aimReady && magAdj > MAG_THRESH && jerk > JERK_THRESH) {
          throwNow();
        }
      };
      window.addEventListener("devicemotion", handleMotion);
    };

    document.getElementById("cancel").onclick = stopSensors;

    function stopSensors() {
      if (!ready && !handleMotion && !handleOrient) return;
      ready = false;
      if (handleMotion) window.removeEventListener("devicemotion", handleMotion);
      if (handleOrient) window.removeEventListener("deviceorientation", handleOrient);
      handleMotion = handleOrient = null;
      socket.emit('aim-off', {
        room: room(),
        name: playerName()
      });
      setStatus("대기중");
    }

    function throwNow() {
      if (!ready) return;
      ready = false;

      const power = Math.max(0, Math.min(1, accPeak / 25));

      const payload = {
        room: room(),
        name: playerName(),
        skin,
        aim: {
          x: lastAim.x,
          y: lastAim.y
        },
        power
      };
      socket.emit("throw-dart", payload);
      setStatus(`던짐! power=${power.toFixed(2)} aim=(${lastAim.x.toFixed(2)}, ${lastAim.y.toFixed(2)})`);
      stopSensors();
    }

    document.getElementById("joinQueue").onclick = () => {
      socket.emit("join-queue");
      setStatus("큐 참가 요청");
    };

    document.getElementById("leaveQueue").onclick = () => {
      socket.emit("leave-queue");
      setStatus("큐 나가기 요청");
    };

    document.getElementById("resetQueue").onclick = () => {
      socket.emit("reset-queue", {
        project: room()
      });
      setStatus("큐 초기화 요청");
    };

    document.getElementById("resetRoom").onclick = () => {
      const r = room();
      if (!confirm(`방 ${r}의 모든 참가자를 연결 해제합니다. 계속하시겠습니까?`)) return;
      socket.emit("disconnect-room", { room: r });
      setStatus(`방 ${r} 초기화 요청`);
    };
  </script>
</body>

</html>
