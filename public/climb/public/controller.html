<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Climb Game – Controller</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    :root {
      --bg: #0b1020;
      --fg: #e8f0ff;
      --card: #111a33;
      --muted: #8aa0c7;
    }

    html,
    body {
      height: 100%
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, Apple SD Gothic Neo, sans-serif;
      display: grid;
      place-items: center
    }

    .wrap {
      width: min(560px, 92vw);
      display: grid;
      gap: 12px
    }

    .card {
      background: var(--card);
      border: 1px solid #22325a;
      border-radius: 16px;
      padding: 14px
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap
    }

    input,
    button {
      font-size: 16px;
      border-radius: 12px;
      border: 1px solid #2a3a66;
      background: #0a1430;
      color: var(--fg);
      padding: 12px
    }

    button.primary {
      background: #51cf66;
      border-color: #51cf66;
      color: #0b1020;
      font-weight: 700
    }

    button.warn {
      background: #2a71ff;
      border-color: #2a71ff;
      font-weight: 700
    }

    button.ghost {
      background: #111a33;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed
    }

    .muted {
      color: var(--muted);
      font-size: 13px
    }

    .big {
      font-size: 22px;
      font-weight: 700
    }

    .status {
      min-height: 20px
    }

    .meter {
      height: 14px;
      border-radius: 8px;
      background: #111a33;
      overflow: hidden
    }

    .bar {
      height: 100%;
      width: 0%;
      background: #4dabf7;
      transition: width 80ms linear;
    }

    .players {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .chip {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #0a1430;
      border: 1px solid #2a3a66;
    }

    .chip.me {
      background: #51cf66;
      color: #0b1020;
      border-color: #51cf66;
      font-weight: 700;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: rgba(11, 16, 32, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.2s ease, visibility 0.2s ease;
      -webkit-overflow-scrolling: touch;
      touch-action: manipulation;
    }

    .modal-overlay.show {
      visibility: visible;
      opacity: 1;
    }

    .modal {
      background: var(--card);
      border: 2px solid #22325a;
      border-radius: 20px;
      padding: 32px;
      min-width: 280px;
      max-width: 90vw;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .modal-title {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .modal-title.win {
      color: #51cf66;
    }

    .modal-title.lose {
      color: #ff6b6b;
    }

    .modal-title.info {
      color: #4dabf7;
    }

    .modal button {
      margin-top: 20px;
      width: 100%;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <div class="row">
        <div class="big">Climb Controller</div>
      </div>
      <div class="row">
        <label>Room</label>
        <input id="room" style="flex:1" />
        <input id="name" placeholder="닉네임" style="flex:1" />
      </div>
      <div class="row">
        <button id="perm" class="warn">모션 권한</button>
        <button id="join" class="ghost" disabled>Join</button>
        <button id="start" class="primary" style="flex:1" disabled>Start Game</button>
        <button id="stop" class="ghost" style="flex:1" disabled>Stop</button>
      </div>
      <div class="row">
        <button id="joinQueue" style="flex:1">큐 참가</button>
        <button id="leaveQueue" style="flex:1">큐 나가기</button>
        <button id="resetQueue">큐 초기화</button>
      </div>
      <div class="meter">
        <div id="bar" class="bar"></div>
      </div>
      <div class="muted">휴대폰을 <b>세워서</b> 위아래로 흔들면 올라갑니다. (최대 4명)</div>
      <div class="status" id="status">대기중…</div>
      <div class="muted" id="playerCount">참여자: 0명</div>
      <div class="players" id="playerList"></div>
      <div class="muted" id="queueStatus">큐: []</div>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-title" id="modalTitle"></div>
      <button class="primary" id="modalClose">확인</button>
    </div>
  </div>

  <script>
    const SOCKET_NAMESPACE = 'https://static-dev.zipshowkorea.com/climb';
    const SOCKET_PATH = '/socket';

    const MOTION = {
      sendInterval: 50,
      threshold: 0.8,
      maxDelta: 20,
    };

    const ERROR_MESSAGES = {
      NO_ROOM: '룸 코드가 없습니다.',
      NO_SUCH_ROOM: '존재하지 않는 룸입니다.',
      ROOM_FULL: '정원이 가득 찼습니다 (최대 4명).',
      NOT_ENOUGH_PLAYERS: '최소 1명부터 시작할 수 있습니다.',
      NO_DISPLAY: '디스플레이가 연결되어 있지 않습니다.',
    };

    const url = new URL(location.href);
    const $ = (id) => document.getElementById(id);
    const roomInput = $('room');
    const nameInput = $('name');
    const bar = $('bar');
    const statusEl = $('status');
    const playerCountEl = $('playerCount');
    const playerListEl = $('playerList');
    const queueStatusEl = $('queueStatus');
    const btnPerm = $('perm');
    const btnJoin = $('join');
    const btnStart = $('start');
    const btnStop = $('stop');
    const modalOverlay = $('modalOverlay');
    const modalTitle = $('modalTitle');
    const modalClose = $('modalClose');

    const setStatus = (t) => { statusEl.textContent = t; };

    function showModal(title, type) {
      modalTitle.textContent = title;
      modalTitle.className = 'modal-title ' + type;
      document.body.style.overflow = 'hidden';
      modalOverlay.classList.add('show');
    }

    function hideModal() {
      modalOverlay.classList.remove('show');
      document.body.style.overflow = '';
    }
    modalClose.onclick = hideModal;

    const room = () => (roomInput.value || 'DEMO').toUpperCase();
    const playerName = () => (nameInput.value || 'Player').slice(0, 16);

    const roomFromQR = (url.searchParams.get('room') || 'DEMO').toUpperCase();
    roomInput.value = roomFromQR;
    if (roomFromQR) roomInput.readOnly = true;
    nameInput.value = 'Player' + Math.floor(Math.random() * 1000);

    const socket = io(SOCKET_NAMESPACE, {
      path: SOCKET_PATH,
      query: { role: 'controller', room: room() },
      reconnection: true,
      transports: ['websocket'],
    });

    socket.on('connect', () => {
      setStatus(`소켓 연결됨 (#${socket.id})`);
      btnJoin.disabled = false;
      socket.emit('status-queue');
    });

    socket.on('status-queue', (queue) => {
      queueStatusEl.textContent = `큐: [${queue.join(', ')}]`;
    });

    socket.on('joinedRoom', ({ room, playerCount, players }) => {
      setStatus(`Joined room ${room}. 게임 시작을 기다리는 중...`);
      updatePlayerCount(playerCount);
      renderPlayerList(players);
      btnStart.disabled = false;
    });

    socket.on('roomPlayerCount', ({ playerCount }) => {
      updatePlayerCount(playerCount);
    });

    socket.on('gameStarted', () => {
      bar.style.width = '0%';
      setStatus('게임 시작! 모션 스트리밍 중...');
      startMotion();
      btnStart.disabled = true;
      btnStop.disabled = false;
    });

    socket.on('gameOver', ({ winnerId, reason }) => {
      stopMotion();
      btnStart.disabled = false;
      btnStop.disabled = true;
      if (reason === 'display_disconnected') {
        showModal('디스플레이 연결 해제', 'info');
        return;
      }
      if (winnerId === socket.id) {
        showModal('Win! 🎉', 'win');
      } else if (winnerId) {
        showModal('Lose 😢', 'lose');
      }
    });

    socket.on('error', (e) => {
      const msg = ERROR_MESSAGES[e?.code] || e?.message || String(e);
      setStatus(`오류: ${msg}`);
    });

    socket.on('roomFull', (data) => {
      // data = { room, maxPlayers }
      setStatus(`정원이 가득 찼습니다 (최대 ${data?.maxPlayers ?? 4}명).`);
    });

    function updatePlayerCount(count) {
      if (count === undefined || count === null) return;
      playerCountEl.textContent = `참여자: ${count}명`;
    }

    function renderPlayerList(players) {
      if (!Array.isArray(players)) return;
      playerListEl.innerHTML = '';
      players.forEach((p) => {
        const chip = document.createElement('span');
        chip.className = 'chip' + (p.socketId === socket.id ? ' me' : '');
        chip.textContent = p.name || 'Unknown';
        playerListEl.appendChild(chip);
      });
    }

    btnJoin.onclick = () => {
      socket.emit('joinRoom', { room: room(), name: playerName() });
      setStatus('Join 요청 전송…');
    };

    btnPerm.onclick = async () => {
      try {
        if (typeof DeviceMotionEvent !== 'undefined' &&
            typeof DeviceMotionEvent.requestPermission === 'function') {
          const r = await DeviceMotionEvent.requestPermission();
          if (r !== 'granted') return alert('모션 권한 거부됨');
        }
        if (typeof DeviceOrientationEvent !== 'undefined' &&
            typeof DeviceOrientationEvent.requestPermission === 'function') {
          await DeviceOrientationEvent.requestPermission().catch(() => {});
        }
        alert('모션 권한 OK');
      } catch (e) {
        alert('권한 요청 오류: ' + e.message);
      }
    };

    btnStart.onclick = () => {
      socket.emit('startGame');
      setStatus('게임 시작 요청 전송...');
    };

    btnStop.onclick = () => {
      stopMotion();
      socket.disconnect();
      btnStart.disabled = false;
      btnStop.disabled = true;
      bar.style.width = '0%';
      setStatus('연결 종료');
    };

    let motionActive = false;
    let deltaBucket = 0;
    let prevMag = 0;
    let sendTimer = null;

    function startMotion() {
      if (motionActive) return;
      motionActive = true;
      window.addEventListener('devicemotion', onMotion, { passive: true });
      sendTimer = setInterval(() => {
        if (!motionActive || deltaBucket <= 0) return;
        const delta = Math.min(deltaBucket, MOTION.maxDelta);
        socket.emit('shake', { delta });
        deltaBucket = 0;
      }, MOTION.sendInterval);
    }

    function stopMotion() {
      if (!motionActive) return;
      motionActive = false;
      window.removeEventListener('devicemotion', onMotion);
      if (sendTimer) {
        clearInterval(sendTimer);
        sendTimer = null;
      }
    }

    function onMotion(e) {
      const a = e.acceleration || e.accelerationIncludingGravity || { x: 0, y: 0, z: 0 };
      const mag = Math.hypot(a.x || 0, a.y || 0, a.z || 0);
      let delta = Math.max(0, mag - prevMag);
      prevMag = mag;
      if (delta < MOTION.threshold) delta = 0;
      deltaBucket += delta;
      bar.style.width = Math.max(0, Math.min(100, delta * 8)) + '%';
    }

    $('joinQueue').onclick = () => {
      socket.emit('join-queue');
      setStatus('큐 참가 요청');
    };
    $('leaveQueue').onclick = () => {
      socket.emit('leave-queue');
      setStatus('큐 나가기 요청');
    };
    $('resetQueue').onclick = () => {
      socket.emit('reset-queue', { project: room() });
      setStatus('큐 초기화 요청');
    };

    window.addEventListener('pagehide', stopMotion);
    window.addEventListener('beforeunload', stopMotion);
  </script>
</body>

</html>
